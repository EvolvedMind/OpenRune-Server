name: Native Commands Validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "engine/game/src/main/kotlin/org/rsmod/game/cheat/CheatHandler.kt"
      - "api/cheat/src/main/kotlin/org/rsmod/api/cheat/CheatHandlerBuilder.kt"
      - "content/other/commands/**"
      - ".github/workflows/native-commands-validation.yml"

permissions:
  contents: read

concurrency:
  group: native-commands-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Compile commands + interface pack
        run: ./gradlew :content:other:commands:compileKotlin :content:other:commands:commands-pack:compileKotlin --no-daemon --console=plain
