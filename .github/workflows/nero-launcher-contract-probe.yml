name: Nero Launcher Contract Probe

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "tools/nero-launcher-contract-probe/**"
      - ".github/workflows/nero-launcher-contract-probe.yml"

jobs:
  compile-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Compile
        run: dotnet build tools/nero-launcher-contract-probe/NeroLauncherContractProbe.csproj -c Release --nologo
      - name: Run contract probe
        run: dotnet run --project tools/nero-launcher-contract-probe/NeroLauncherContractProbe.csproj -c Release --no-build
